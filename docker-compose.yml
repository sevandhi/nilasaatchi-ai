services:
  db:
    build: ./db/docker
    image: nilasaatchi-db:16-3.4-pgvector
    environment:
      POSTGRES_USER: nila
      POSTGRES_PASSWORD: nila_local_dev
      POSTGRES_DB: nilasaatchi
    ports: ["5439:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nila -d nilasaatchi"]
      interval: 5s
      timeout: 5s
      retries: 20
  ocr-tools:
    build: ./infra/ocr-tools
    image: nilasaatchi-ocr-tools:latest
    profiles: ["tools"]
    volumes: [".:/work"]
    working_dir: /work
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
volumes:
  pgdata:
  ollama:
